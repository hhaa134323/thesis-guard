# Thesis Watch 配置示例（v0.1）。复制为 config.yaml 后改值。
# 红线阈值与文案用户可调；黑名单只能扩展、不可缩水到低于红线要求。

# Layer 2 通用红线默认包阈值（用户可调）
redline:
  thresholds:
    large_fine:
      amount_usd: 100000000      # 大额罚单阈值（美元）；调小则更敏感
    exec_change:
      roles: ["CEO", "CFO"]      # 监控的高管角色
      lookback_days: 30          # 回看窗口
    restatement:
      forms: ["20-F", "10-K", "10-Q", "6-K"]   # 触发重述检测的表单
  # R3 文案黑名单扩展（叠加在默认之上，默认见 src/thesis_watch/redline.py）
  extra_forbidden_phrases: []

# 数据源（仅限 SEC EDGAR 官方接口 + 公开新闻标题 RSS；v1 不含价格类警报）
data_sources:
  sec_edgar:
    base_url: "https://www.sec.gov/cgi-bin/browse-edgar"
    # 外国发行人（20-F/6-K 申报方）以 6-K 为主渠道，不得沿用「6-K 降级」规则
    foreign_filer_primary_form: "6-K"
  news_rss:
    yahoo_headline: "https://feeds.finance.yahoo.com/rss/2.0/headline"

# 触达（仅邮件；命中当天单独发，未命中合并进每日简报）
email_sink:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  sender: ""              # 作者 Gmail 地址
  app_password: ""        # Gmail 应用专用密码，勿提交
  # 命中邮件模板与每日简报模板见 src/thesis_watch/render（待接入）

# Agent loop 选型确认（2026-08-01）：PydanticAI 单次结构化调用（非 Claude Agent SDK）。
# 会话模型与任务模型分离——两个独立配置项，不复用同一字段：
#   - session_model：作者会话产 spec/schema/prompt 用（Anthropic 协议端点，glm-5.2）
#   - task_model   ：录入抽取 + eval（OpenAI 协议端点，轻量 flash）
# 分离理由见 docs/changelog.md v0.0.4（避免争抢额度 / 消除 eval 自评污染 / 批量成本）。
# API key 一律走 env（api_key_env 指向变量名），不进 config、不进提交。
llm:
  session_model:
    provider: anthropic
    base_url: "https://dashscope.aliyuncs.com/apps/anthropic"
    model: "glm-5.2"
    api_key_env: "ANTHROPIC_AUTH_TOKEN"
  task_model:
    provider: openai
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "glm-5.2-fast-preview"   # B4 升级后默认（W1 胜率 96% + W2 接受率 85.45% ≥ 85%；2026-08-02）；qwen-turbo 仅冒烟/回归（--model 覆盖）
    api_key_env: "ANTHROPIC_AUTH_TOKEN"
  max_tokens: 8192
  # 限流防护（eval 批跑用；429 与其它错误分开计数进 per-call 指标表）
  request_interval_sec: 0.5
  max_retries_429: 5
  backoff_base_sec: 2.0
  backoff_cap_sec: 60.0
  max_concurrency: 1   # eval 批跑：串行（=1）或限制并发，不并发打满

# 预置账号（5 人 beta，无注册系统；email 在 store.SEED 后由作者填）
preset_users:
  - {user_id: beta1, display_name: "Beta One"}
  - {user_id: beta2, display_name: "Beta Two"}
  - {user_id: beta3, display_name: "Beta Three"}
  - {user_id: beta4, display_name: "Beta Four"}
  - {user_id: beta5, display_name: "Beta Five"}
