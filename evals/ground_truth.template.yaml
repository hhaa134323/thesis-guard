# 🚨 R8 红线（与 R1–R7 同级）：本文件是 eval ground truth（**仅客观字段**），必须由作者手工标注。
# Claude/任何模型不许生成、推断、或用模型产出去填。
#
# Eval 设计 v2（eval-plan §9）：主观字段（holding_reason / key_assumptions / mirrors）**不进 GT**，
# 走盲评（§9.4）。`manual_items` 也**不进 GT**——按 `docs/data-sources.md` 规则推导（价格图形型 → manual），
# 与 position_cap_tier 同类（规则推导，不交人/模型猜）。本文件只标**有唯一可查证答案的客观字段**。
#
# 用法：填全后 harness（`evals/run_l1.py run`）才跑。
# 输入 harness 自动从 assets/notion/thesis/<ticker>.md 的「Thesis · 为什么买」段读（你不用填输入）。
#
# exposure（必填）：seen = 你看过该 ticker 抽取结果（仅参考，不进 85% 判定）；clean = 未看过（进判定）。
#   → FDS、HSBC 标 seen；其余 13 条标 clean。
# input_type（必填）：ai_polished = 台账 AI 结构化输入（现有 15 条全属此类）；raw = 真实用户口述（W3 引入）。
#   → 15 条全 ai_polished。Limitation：当前分数基于 AI 结构化输入，面向 raw 预期下降，W3 重测。
#
# 客观字段（填什么 / 判断标准 / 留空条件）。⚠️ 说明无示例值，不用其他 ticker 举例——避免锚定。
#
#   filer_type : 填申报方类型，取值四选一：
#     domestic_10k            = 美国本土公司，10-K 申报方
#     foreign_issuer_20f_6k   = 外国发行人，20-F/6-K 申报方
#     etf_fund                = ETF/ETN/基金/信托（无 10-K/20-F；QQQ/GDXU 等。v1 不支持自动核对 → harness 全 manual）
#     other                    = 其余
#     留空条件：无（每个 ticker 都有申报方类型）。null 须配 open_questions。
#
#   entry_anchor : 填录入估值锚 {anchor_type, anchor_value, note}。
#     判断：估值型破条件用；锚类型由 thesis 类型定（现金流类 / 控股投资类 / 指数类各不同）；value 无数据留 null。
#     留空条件：台账无估值锚信息 → null（optional，不强制 open_questions，但鼓励写原因）。
#
#   next_verdict : 填下一个能证伪 thesis 的事件+日期 {event, date, source_note}。
#     判断：下一次有新证据能让 thesis 被推翻的时点（财报日 / 监管裁定日 等），不等于「下次复盘日」。
#     留空条件：台账无此信息 → null（optional）。
#
#   open_questions : 列你标 null 的字段 + 原因，每条 {field: <字段名>, reason: <台账为何信息不足>}。
#     harness 见 null + open_questions → 该字段从一致率分母剔除，单独统计「台账模糊字段数」（产品发现）。
#     required 客观字段（filer_type）若 null 但无 open_questions → harness 报错退出（R8）。
#     optional 客观字段（entry_anchor / next_verdict）null 不强制 open_questions。
#
# 不在本文件（规则推导 / 盲评，都不手标）：
#   - manual_items：按 docs/data-sources.md 规则推导（is_price_pattern W1）。
#   - position_cap_tier：按 ticker 查 tier_map。
#   - holding_reason / key_assumptions / mirrors：走盲评（eval-plan §9.4）。

