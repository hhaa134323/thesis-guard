      - assumption_text: Reverse DCF 在 r=9% 和 10% 下隐含永续 FCF 增速仅 2.75%–3.75%，远低于 ASV
          ~6% + 回购减股 ~3% 的实际轨迹，两种折现率下均显示便宜
        mirror_text: FCF 显著恶化或 ASV+回购实际增速降至隐含永续增速（2.75%–3.75%）水平或以下
      - assumption_text: GAAP 口径门槛偏保守：调整后 EPS（剔收购无形资产摊销）比 GAAP 高约 12%
        mirror_text: GAAP 与调整后 EPS 差距收窄至可忽略（如收购无形资产摊销大幅减少），保守余量消失
