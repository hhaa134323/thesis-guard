          occurred: false
        source_type: press_release_text
- case: GOOGL
  fields:
    holding_reason_raw:
      A: 押「分发护城河」这个 job，而不是押「谁家模型最强」这个会被商品化的 task。基于 Benedict Evans 框架：模型商品化→价值沉淀到分发+应用层。Alphabet
        拥有 Search/Chrome/Android/Workspace/YouTube 数十亿默认入口，把 Gemini 嵌进每个用户的选择时刻，不需要赢模型质量，只需「足够好+默认在位」。
      B: 按 Benedict Evans「模型商品化 → 价值沉淀到分发+应用层」的推导:基础模型大概率走电力/平板屏的路(造起来难、却没定价权),AI
        的胜负手不是 benchmark 而是分发。Alphabet 握着全世界最深的分发——Search / Chrome / Android / Workspace
        / YouTube 数十亿默认入口,把 Gemini 嵌进每个用户的选择时刻,不需要赢模型质量,只需「足够好 + 默认在位」。买 GOOGL = 押「分发护城河」这个
        job,而不是押「谁家模型最强」这个会被商品化的 task。
    key_assumptions:
      A:
      - text: Alphabet 的搜索/Chrome/Android/Workspace/YouTube 默认分发网络构成结构性切换成本，使竞品难以通过
          AI 模型质量优势突破
        judgeable: true
      B:
      - text: AI 原生交互范式不会替代 GOOGL 现有分发入口成为主流用户选择时刻——Search/Chrome/Android/Workspace/YouTube
          的默认入口地位在 AI 时代持续有效
        judgeable: true
      - text: 监管不会强制拆分 GOOGL 的分发资产（Chrome/Android/Search 等）——默认入口结构的完整性是分发护城河的前提
        judgeable: true
    mirrors:
      A:
      - assumption_text: AI 原生交互范式不会替代 GOOGL 现有分发入口成为主流用户选择时刻——Search/Chrome/Android/Workspace/YouTube
          的默认入口地位在 AI 时代持续有效
        mirror_text: Google Search & other 收入 YoY 增速转负，反映 AI 原生竞品正在蚕食分发入口用户基数
        threshold:
          metric: search_and_other_rev_yoy
          operator: <
          value: 0
        source_type: sec_filing_field
      - assumption_text: 监管不会强制拆分 GOOGL 的分发资产（Chrome/Android/Search 等）——默认入口结构的完整性是分发护城河的前提
        mirror_text: 反垄断裁决强制 GOOGL 剥离分发资产（Chrome/Android/Search 等），默认入口结构被打破
        threshold:
          event: antitrust_divestiture_order
          occurred: false
        source_type: news_headline
      B:
      - assumption_text: Alphabet 的搜索/Chrome/Android/Workspace/YouTube 默认分发网络构成结构性切换成本，使竞品难以通过
          AI 模型质量优势突破
        mirror_text: Google 全球搜索市场份额跌破 70%，表明用户可通过竞品 AI 绕过 Google 默认分发
        threshold:
          metric: google_search_global_market_share_pct
          operator: <
          value: 70
        source_type: manual
