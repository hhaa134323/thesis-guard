- case: FDS
  fields:
    holding_reason_raw:
      A: FactSet = 金融数据与分析订阅平台，深度嵌入买卖方工作流、转换成本高、ASV（年化订阅）经常性强、续约率高。价值角度：高黏性订阅 + 稳定现金流的「卖铲子」生意。
      B: FactSet是深度嵌入买卖方工作流的金融数据与分析订阅平台，转换成本高、ASV年化订阅经常性强、续约率高，是高黏性订阅+稳定现金流的「卖铲子」生意。
    key_assumptions:
      A:
      - text: 深度嵌入买卖方工作流，转换成本锁定客户，竞品难蚕食份额
        judgeable: true
      B:
      - text: 切换成本锁定客户，竞品难蚕食份额
        judgeable: true
    mirrors:
      A:
      - assumption_text: 切换成本锁定客户，竞品难蚕食份额
        mirror_text: 主要客户转投竞品或ASV客户留存率跌破90%
        threshold:
          metric: asv_client_retention_rate
          operator: <
          value: 90
        source_type: sec_filing_field
      B:
      - assumption_text: 深度嵌入买卖方工作流，转换成本锁定客户，竞品难蚕食份额
        mirror_text: 客户续约率跌破 90%，或 ASV 同比增速转负，显示转换成本不再有效锁定客户
        threshold:
          metric: client_retention_rate
          operator: <
          value: 90
        source_type: sec_filing_field
- case: HSBC
  fields:
    holding_reason_raw:
      A: 以亚洲（香港）为核心的全球性大型银行，庞大的存款/财富管理特许经营权 + 跨境贸易网络，长期分红；价值角度：大而稳的息差生意 + 股息回报
      B: 以亚洲（香港）为核心的全球性大型银行，庞大的存款/财富管理特许经营权 + 跨境贸易网络，长期分红。价值角度：大而稳的息差生意 + 股息回报。
    key_assumptions:
      A:
      - text: 汇丰亚洲存款基础的结构性低成本资金优势与跨境网络客户粘性构成护城河，竞品难以蚕食份额
        judgeable: true
      - text: 汇丰港区跨境财富管理增量获客依赖内地客户离岸投资渠道，监管未收紧是 franchise 增长前提
        judgeable: true
      - text: 汇丰净息差可通过定价转嫁资金成本，不会长期收窄至侵蚀核心盈利能力
        judgeable: true
      - text: 汇丰中国/香港信贷敞口不构成系统性风险，资产质量穿越周期保持稳定
        judgeable: true
      - text: 汇丰的资本充足率与盈利能力支撑当前分红政策（50% 派息率+回购），不会被监管或经营压力迫使长期削减
        judgeable: true
      B:
      - text: HSBC's Hong Kong deposit franchise is protected by high customer switching
          costs and relationship banking, making it resilient to digital disruption
          and competitive pressure from fintech/neobanks
        judgeable: true
      - text: HSBC's cross-border trade and payments network creates structural network
          effects that protect its transaction banking and trade finance revenue from
          being disintermediated by digital/alternative payment platforms
        judgeable: true
      - text: Regulatory restrictions on cross-border capital flows between Mainland
          China and Hong Kong will not materially worsen, preserving HSBC's wealth
          management growth channel
        judgeable: true
    mirrors:
      A:
      - assumption_text: HSBC's Hong Kong deposit franchise is protected by high customer
          switching costs and relationship banking, making it resilient to digital
          disruption and competitive pressure from fintech/neobanks
        mirror_text: HSBC's Hong Kong personal banking deposits decline YoY for 2
          consecutive quarters, or deposit cost rises faster than peer average
        threshold:
          metric: hk_personal_deposits_yoy_change_pct
          operator: <
          value: 0
        source_type: sec_filing_field
      - assumption_text: HSBC's cross-border trade and payments network creates structural
          network effects that protect its transaction banking and trade finance revenue
          from being disintermediated by digital/alternative payment platforms
        mirror_text: HSBC's trade finance or transaction banking revenue declines
          YoY for 3 consecutive quarters, indicating structural disintermediation
        threshold:
          metric: trade_finance_revenue_yoy_change_pct
          operator: <
          value: 0
        source_type: sec_filing_field
      - assumption_text: Regulatory restrictions on cross-border capital flows between
          Mainland China and Hong Kong will not materially worsen, preserving HSBC's
          wealth management growth channel
        mirror_text: HKMA or PBOC announces new or tightened restrictions on Mainland
          Chinese residents' offshore investment accounts at Hong Kong banks
        threshold:
          event: hk_cn_offshore_restriction_announced
          occurred: true
        source_type: news_headline
      B:
      - assumption_text: 汇丰亚洲存款基础的结构性低成本资金优势与跨境网络客户粘性构成护城河，竞品难以蚕食份额
        mirror_text: 竞品蚕食存款/财富管理份额——HSBC 港区/亚洲客户存款或财富管理 AUM 同比下滑
        threshold:
          metric: hk_customer_accounts_yoy_pct
          operator: <
          value: 0
        source_type: sec_filing_field
      - assumption_text: 汇丰港区跨境财富管理增量获客依赖内地客户离岸投资渠道，监管未收紧是 franchise 增长前提
        mirror_text: 香港/内地监管收紧内地客户离岸投资账户，HSBC 港区财富管理获客渠道受阻
        threshold:
          event: prc_hk_regulatory_tightening_offshore_investment
          occurred: false
        source_type: news_headline
      - assumption_text: 汇丰净息差可通过定价转嫁资金成本，不会长期收窄至侵蚀核心盈利能力
        mirror_text: NIM 长期收窄且无法转嫁，净息差持续下降侵蚀核心盈利
        threshold:
          metric: net_interest_margin_yoy_bps
          operator: <
          value: -25
        source_type: sec_filing_field
      - assumption_text: 汇丰中国/香港信贷敞口不构成系统性风险，资产质量穿越周期保持稳定
        mirror_text: 中国/香港信贷敞口出现系统性损失，信贷成本跳升
        threshold:
          metric: ecl_as_pct_of_avg_loans
          operator: '>'
          value: 0.8
        source_type: sec_filing_field
      - assumption_text: 汇丰的资本充足率与盈利能力支撑当前分红政策（50% 派息率+回购），不会被监管或经营压力迫使长期削减
        mirror_text: 被迫长期削减股息——分红政策从 50% 派息率下调或暂停回购
        threshold:
          event: dividend_cut_or_buyback_suspension
          occurred: false
        source_type: press_release_text
- case: BRK.B
  fields:
    holding_reason_raw:
      A: 伯克希尔是价值投资的载体本身：多元控股 + 保险浮存金长期复利，管理稳健、极少出现永久性本金损失。买BRK.B≈买'稳健价值投资'这个能力圈，长期持有不折腾。
      B: 价值投资的载体本身：多元控股 + 保险浮存金长期复利，管理稳健、极少出现永久性本金损失。买 BRK.B ≈ 买「稳健价值投资」这个能力圈，长期持有不折腾。
    key_assumptions:
      A:
      - text: 保险浮存金作为低成本结构性资金来源持续复利
        judgeable: true
      B:
      - text: 伯克希尔的保险浮存金成本长期低于国债利率，且承保端综合成本率持续低于100，使浮存金成为可靠的负成本杠杆，这是其超越普通股权投资者的结构性优势
        judgeable: true
      - text: 伯克希尔多元控股结构使其能在不同行业和经济周期中持续将资本从成熟业务重新配置到高回报领域，形成超越单一业务公司的抗周期和复利能力
        judgeable: true
      - text: 伯克希尔的价值投资文化和资本配置纪律能通过制度和企业文化传承延续至后巴菲特时代，管理层更替不会破坏其长期竞争优势
        judgeable: true
    mirrors:
      A:
      - assumption_text: 保险浮存金作为低成本结构性资金来源持续复利
        mirror_text: 综合成本率超过100%，承保出现亏损，浮存金不再低成本
        threshold:
          metric: combined_ratio
          operator: '>'
          value: 100
        source_type: sec_filing_field
      - assumption_text: 保险浮存金作为低成本结构性资金来源持续复利
        mirror_text: 浮存金规模同比下降，复利引擎失效
        threshold:
          metric: insurance_float_yoy
          operator: <
          value: 0
        source_type: sec_filing_field
      B:
      - assumption_text: 伯克希尔的保险浮存金成本长期低于国债利率，且承保端综合成本率持续低于100，使浮存金成为可靠的负成本杠杆，这是其超越普通股权投资者的结构性优势
        mirror_text: 伯克希尔保险业务综合成本率连续三年超过105，或浮存金隐含融资成本持续高于同期国债利率
        threshold:
          metric: insurance_combined_ratio_3yr_avg
          operator: '>='
          value: 105
        source_type: sec_filing_field
      - assumption_text: 伯克希尔多元控股结构使其能在不同行业和经济周期中持续将资本从成熟业务重新配置到高回报领域，形成超越单一业务公司的抗周期和复利能力
        mirror_text: 伯克希尔五大非保险业务（BNSF、BHE、制造业、服务与零售、金融产品）中有三项以上出现连续两年运营利润下滑
        threshold:
          metric: non_insurance_segments_declining_count
          operator: '>='
          value: 3
        source_type: sec_filing_field
      - assumption_text: 伯克希尔的价值投资文化和资本配置纪律能通过制度和企业文化传承延续至后巴菲特时代，管理层更替不会破坏其长期竞争优势
        mirror_text: 后巴菲特时代管理层完成一笔超过净资产15%的大型收购，且该收购在三年内累计减值超过收购金额的30%
        threshold:
          metric: cumulative_impairment_pct_of_acquisition_cost
          operator: '>='
          value: 0.3
        source_type: sec_filing_field
- case: MCO
