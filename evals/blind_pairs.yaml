      A: FactSet = 金融数据与分析订阅平台，深度嵌入买卖方工作流、转换成本高、ASV（年化订阅）经常性强、续约率高。价值角度：高黏性订阅 + 稳定现金流的「卖铲子」生意。
      B: null
    key_assumptions:
      A:
      - text: FactSet 平台深度嵌入买卖方工作流，转换成本高，构成护城河
        judgeable: true
      - text: ASV 经常性强、续约率高，提供稳定现金流
        judgeable: true
      - text: Reverse DCF 在 r=9% 和 10% 下隐含永续 FCF 增速仅 2.75%–3.75%，远低于 ASV ~6% + 回购减股
