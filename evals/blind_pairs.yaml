      A: 全球流媒体规模龙头，最大订阅基数 + 自制内容飞轮 + 已验证的定价权（多次提价 churn 可控），广告档与打击共享账号打开新增长。价值角度：规模经济
        + 定价权带来的自由现金流转正与扩张。
      B: 全球流媒体规模龙头，最大订阅基数 + 自制内容飞轮 + 已验证的定价权（多次提价 churn 可控），广告档与打击共享账号打开新增长。价值角度：规模经济
        + 定价权带来的自由现金流转正与扩张。
    key_assumptions:
      A:
      - text: Netflix 的订阅基数规模优势带来内容成本摊薄效应，使同等内容质量下利润率高于竞争对手——竞争对手无法在不牺牲利润的前提下复制其内容库规模，构成结构性成本护城河。
