- case: FDS
  fields:
    holding_reason_raw:
      A: FactSet = 金融数据与分析订阅平台，深度嵌入买卖方工作流、转换成本高、ASV（年化订阅）经常性强、续约率高。价值角度：高黏性订阅 + 稳定现金流的「卖铲子」生意。
      B: null
    key_assumptions:
      A:
      - text: FactSet 深度嵌入买方/卖方工作流，转换成本高，客户难以迁移至竞品。
        judgeable: true
      - text: ASV（年化订阅价值）经常性强、续约率高，构成稳定且可预测的经常性收入。
        judgeable: true
      - text: 作为金融基础设施「卖铲子」生意，具备高黏性订阅 + 稳定现金流的价值属性。
        judgeable: true
      B: null
    mirrors:
      A: null
      B:
      - assumption_text: FactSet 深度嵌入买方/卖方工作流，转换成本高，客户难以迁移至竞品。
        mirror_text: 客户工作流对 FactSet 的依赖度下降——例如竞品（Bloomberg、Refinitiv 等）在 API/集成/内容覆盖上反超，或大客户批量迁移至替代平台，转换成本壁垒被实质性削弱。
      - assumption_text: ASV（年化订阅价值）经常性强、续约率高，构成稳定且可预测的经常性收入。
        mirror_text: ASV 增速持续放缓或转负、续约率/留存率显著下降，表明订阅黏性被侵蚀，经常性收入不再稳定可预测。
      - assumption_text: 作为金融基础设施「卖铲子」生意，具备高黏性订阅 + 稳定现金流的价值属性。
        mirror_text: 买方/卖方行业整合或预算削减导致客户基数萎缩，或订阅模式被按需/一次性付费模式冲击，现金流稳定性与「卖铲子」逻辑被证伪。
