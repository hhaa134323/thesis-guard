# 🚨 R8 红线（与 R1–R7 同级）：本文件是 eval ground truth，必须由作者（caca）手工标注。
# Claude/任何模型不许生成、推断、或用模型产出去填。
#
# 用法：拷本模板为 evals/ground_truth.yaml，填全后 harness（evals/run_l1.py）才跑。
# 输入 harness 自动从 assets/notion/thesis/<ticker>.md 的「Thesis · 为什么买」段读（你不用填输入）。
# 你只填下面的「期望抽取」。
#
# exposure（必填，每条都填）：
#   seen  = 你已看过该 ticker 的抽取结果（会被锚定，一致率天然偏高，仅参考，不进 85% 判定）
#   clean = 未看过（进 85% 判定，作准）
#   → FDS、HSBC 标 seen（演练 / gate 阶段曝光过）；其余 13 条标 clean。
#
# 各字段（填什么 / 判断标准 / 留空条件）。⚠️ 说明里无任何示例值，也不用其他 ticker 举例——避免锚定你。
#
#   holding_reason_raw : 填期望的买入理由原话（一句）。
#     判断：抓 thesis 的核心——moat 是什么 + 为什么 5-10 年不被颠覆。
#     留空条件：无（thesis 总有买入理由）。若实在标不出 → null + open_questions。
#
#   key_assumptions : 填期望关键假设列表，每条 {text: ...}。
#     判断：thesis 成立所依赖的具体前提，且能被一手公开披露击中（不是模糊词）。
#     留空条件：无。若标不出 → null + open_questions。
#
#   mirrors : 填期望镜像破局条件列表，每条 {assumption_text: ..., mirror_text: ...}。
#     判断：对应台账「Thesis 破的条件」逐条结构化——破哪条假设 → 什么具体事件/数据点出现。
#     留空条件：无。若台账破条件信息不足 → null + open_questions。
#
#   manual_items : 填期望人工自查项列表，每条 {text, reason, cadence}。
#     判断：仅当 thesis 依赖价格图形（均线/形态/突破/支撑阻力等）才填；否则填 []（期望空）。
#     留空条件：台账无价格图形信息 → 填 []；信息不足判断 → null + open_questions。
#
#   filer_type : 填申报方类型，取值三选一：
#     domestic_10k            = 美国本土公司，10-K 申报方
#     foreign_issuer_20f_6k   = 外国发行人，20-F/6-K 申报方
#     other                    = 其余
#     留空条件：无。若标不出 → null + open_questions。
#
#   next_verdict : 填下一个能证伪 thesis 的事件+日期 {event, date, source_note}。
#     判断：下一次有新证据能让 thesis 被推翻的时点（财报日 / 监管裁定日 等），不等于「下次复盘日」。
#     留空条件：台账无此信息 → 填 null + open_questions（不算模型错，从该字段分母剔除，单独统计）。
#
#   entry_anchor : 填录入估值锚 {anchor_type, anchor_value, note}。
#     判断：估值型破条件用——锚类型由 thesis 类型定（现金流类/控股投资类/指数类各不同）；value 无数据留 null。
#     留空条件：台账无估值锚信息 → 填 null + open_questions。
#
#   open_questions : 列出你标 null 的字段 + 原因，每条 {field: <字段名>, reason: <台账为何信息不足>}。
#     仅当某字段因台账信息不足填 null 时才记。
#     harness 见 null + open_questions → 该字段从一致率分母剔除，单独统计「台账模糊字段数」（产品发现：多少 thesis 模糊）。
#     required 字段（holding_reason_raw/key_assumptions/mirrors/filer_type）若 null 但无 open_questions → harness 报错退出（R8）。
#
# position_cap_tier 不填——harness 按 ticker 查 tier_map（确定性，不交给模型）。

cases:
